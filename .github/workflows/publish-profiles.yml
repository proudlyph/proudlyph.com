name: Regenerate ProudlyPH product profiles
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/catalog.json'
      - 'tools/build-profiles.mjs'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build-profiles.mjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Refresh ProudlyPH product profiles"
            git push
          fi
